<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video quality lab</title>
    <style>
      body { margin: 24px; background: #17191d; color: #eceff4; font: 15px system-ui; }
      button, select, input { font: inherit; margin: 0 12px 12px 0; padding: 8px; }
      canvas { display: block; max-width: 100%; height: auto; background: black; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Video quality lab</h1>
    <p>Tests the actual WebGL shaders. Recordings and results stay in build-video-quality.</p>
    <button id="synthetic" type="button">Run image quality checks</button>
    <button id="timing" type="button">Benchmark 1080p → 4K</button>
    <button id="invariants" type="button">Check motion and fallback</button>
    <button id="lifecycle" type="button">Check renderer lifecycle</button>
    <button id="anamorphic" type="button">Check anamorphic video geometry</button>
    <label>Clip <select id="clip"><option>sport</option><option>film</option><option>sd</option></select></label>
    <button id="compare" type="button">Compare recorded frame</button>
    <pre id="status">Loading…</pre>
    <canvas id="output"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
